<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Owlpaca Studio — Pose, Draw, Play</title>
  <meta name="description" content="Life drawing, creative gatherings, exhibitions and collaborations from Owlpaca Studio.">
  <style>
    html,body{margin:0;width:100%;height:100%;background:#e9dfd0;color:#352920;font:18px/1.6 Georgia,serif}
    #message{padding:10vh 8%;max-width:650px}h1{font-size:52px;font-weight:400}a{color:inherit}
    iframe{display:block;border:0;width:100%;height:100dvh} [hidden]{display:none!important}
  </style>
</head>
<body>
  <main id="message"><h1>Owlpaca Studio</h1><p id="status" role="status">Opening the studio…</p><button id="retry" hidden>Try again</button></main>
  <iframe id="studio" title="Owlpaca Studio website" hidden></iframe>
  <noscript><p>Explore the studio’s <a href="https://luma.com/user/usr-2NbeyBAYjQBHw4i">upcoming gatherings on Luma</a>.</p></noscript>
  <script>
    async function loadStudio() {
      const message = document.querySelector('#message');
      const status = document.querySelector('#status');
      const retry = document.querySelector('#retry');
      const frame = document.querySelector('#studio');
      retry.hidden = true;
      try {
        const response = await fetch('https://owlpaca-studio.yangziyi96.chatgpt.site/api/public-site', { cache: 'no-store', credentials: 'omit' });
        if (!response.ok) throw new Error('The studio could not be opened.');
        const data = await response.json();
        if (typeof data.html !== 'string') throw new Error('The studio could not be opened.');
        frame.srcdoc = data.html;
        frame.hidden = false;
        message.hidden = true;
      } catch {
        status.textContent = 'The studio is being prepared. Please check back shortly.';
        retry.hidden = false;
      }
    }
    document.querySelector('#retry').addEventListener('click', loadStudio);
    loadStudio();
  </script>
</body>
</html>
